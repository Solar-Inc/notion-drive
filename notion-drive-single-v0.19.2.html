<!doctype html>
<html lang="en">
  <head>
    <!-- Notion Drive v0.19.2 single-file GitHub Pages build -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title data-i18n="appTitle"></title>
    <style>
:root {
  color-scheme: dark;
  --canvas: #191919;
  --surface: #202020;
  --raised: #2a2a29;
  --hover: #383836;
  --text: #fff;
  --muted: rgba(255, 255, 255, 0.64);
  --border: rgba(255, 255, 255, 0.14);
  --blue: #5e9fe8;
  --blue-soft: rgba(94, 159, 232, 0.14);
  --green: #72bc8f;
  --orange: #de9255;
  --red: #e97366;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.18), 0 10px 30px rgba(0, 0, 0, 0.18);
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  min-width: 900px;
  height: 100%;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    sans-serif;
  background: var(--canvas);
  color: var(--text);
  font-size: 15px;
}
button,
input {
  font: inherit;
}
button {
  color: inherit;
}
.hidden {
  display: none !important;
}
.app-shell {
  display: grid;
  grid-template-columns: 248px minmax(0, 1fr);
  height: 100vh;
  overflow: hidden;
}
.sidebar {
  display: flex;
  flex-direction: column;
  padding: 20px 16px 16px;
  border-right: 1px solid var(--border);
  background: #1d1d1c;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 8px 24px;
}
.brand-mark {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: #fff;
  color: #171717;
  font-family: Georgia, serif;
  font-size: 21px;
  font-weight: 800;
}
.brand strong,
.brand span {
  display: block;
}
.brand strong {
  font-size: 15px;
}
.brand span {
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
}
.primary-button,
.secondary-button,
.text-button,
.icon-button,
.nav-item,
.segmented {
  border: 0;
  cursor: pointer;
}
.primary-button,
.secondary-button {
  min-height: 44px;
  padding: 10px 14px;
  border-radius: 8px;
  font-weight: 650;
}
.primary-button {
  background: var(--blue);
  color: #0d2238;
}
.primary-button:hover {
  filter: brightness(1.06);
}
.secondary-button {
  background: var(--raised);
  border: 1px solid var(--border);
}
.secondary-button:hover,
.icon-button:hover,
.nav-item:hover {
  background: var(--hover);
}
.sidebar > .primary-button,
.sidebar > .secondary-button {
  width: 100%;
  margin-bottom: 8px;
}
.nav-list {
  display: grid;
  gap: 4px;
  margin-top: 18px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  min-height: 42px;
  padding: 8px 12px;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  text-align: left;
}
.nav-item span {
  width: 20px;
  text-align: center;
  font-size: 18px;
}
.nav-item .nav-label {
  width: auto;
  text-align: left;
  font-size: inherit;
}
.nav-item.active {
  background: var(--blue-soft);
  color: #b9dafe;
}
.sidebar-spacer {
  flex: 1;
}
.profile-switcher { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; }
.profile-list { max-height: 180px; overflow-y: auto; }
.profile-item { display: block; width: 100%; padding: 9px 12px; border: 0; border-radius: 8px; background: transparent; text-align: left; color: var(--muted); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.profile-item:hover { background: var(--hover); }
.profile-item.active { background: var(--blue-soft); color: #b9dafe; }
.connection-card {
  display: flex;
  gap: 10px;
  align-items: center;
  margin: 12px 8px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.025);
}
.connection-card strong,
.connection-card small {
  display: block;
}
.connection-card strong {
  font-size: 13px;
}
.connection-card small {
  margin-top: 3px;
  color: var(--muted);
  font-size: 11px;
}
.status-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--orange);
  box-shadow: 0 0 0 4px rgba(222, 146, 85, 0.12);
}
.connection-card.connected .status-dot {
  background: var(--green);
  box-shadow: 0 0 0 4px rgba(114, 188, 143, 0.12);
}
.settings-link {
  margin-top: 2px;
}
.main-content {
  min-width: 0;
  overflow: auto;
  background: var(--canvas);
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 72px;
  padding: 12px 32px;
  border-bottom: 1px solid var(--border);
  background: rgba(25, 25, 25, 0.92);
  backdrop-filter: blur(16px);
}
.breadcrumbs {
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
}
.breadcrumbs button {
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  padding: 7px;
  border-radius: 6px;
  white-space: nowrap;
}
.breadcrumbs button:hover {
  background: var(--raised);
  color: var(--text);
}
.breadcrumbs button + button:before {
  content: "/";
  margin-right: 8px;
  color: rgba(255, 255, 255, 0.28);
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 260px;
  height: 42px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
}
.search-box:focus-within {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--blue-soft);
}
.search-box input {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
}
.search-box input::placeholder {
  color: rgba(255, 255, 255, 0.42);
}
.icon-button {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 20px;
}
.content-area {
  max-width: 1240px;
  margin: 0 auto;
  padding: 32px;
}
.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 28px;
}
.section-heading h1 {
  margin: 0;
  font-size: 28px;
  line-height: 1.2;
  letter-spacing: -0.02em;
}
.section-heading p {
  margin: 7px 0 0;
  color: var(--muted);
}
.view-actions {
  display: flex;
}
.segmented {
  width: 42px;
  height: 38px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
}
.segmented:first-child {
  border-radius: 8px 0 0 8px;
}
.segmented:last-child {
  border-radius: 0 8px 8px 0;
  margin-left: -1px;
}
.segmented.active {
  position: relative;
  background: var(--raised);
  color: var(--text);
  border-color: rgba(255, 255, 255, 0.28);
}
.notice {
  margin-bottom: 20px;
  padding: 12px 14px;
  border: 1px solid rgba(222, 146, 85, 0.38);
  border-radius: 8px;
  background: rgba(222, 146, 85, 0.1);
  color: #f0bd91;
}
.loading-state,
.empty-state {
  display: grid;
  place-items: center;
  text-align: center;
  min-height: 440px;
  border: 1px dashed var(--border);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.015);
}
.loading-state p,
.empty-state p {
  color: var(--muted);
}
.empty-state > *,
.loading-state > * {
  margin: 6px;
}
.empty-icon {
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  border-radius: 16px;
  background: var(--blue-soft);
  color: var(--blue);
  font-size: 32px;
}
.spinner {
  width: 30px;
  height: 30px;
  border: 3px solid rgba(255, 255, 255, 0.12);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.file-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(176px, 1fr));
  gap: 14px;
}
.file-grid.list {
  display: block;
  border-top: 1px solid var(--border);
}
.file-card {
  position: relative;
  min-height: 154px;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  cursor: pointer;
  transition:
    border-color 0.15s,
    background 0.15s,
    transform 0.15s;
}
.file-card:hover {
  background: var(--raised);
  border-color: rgba(255, 255, 255, 0.27);
  transform: translateY(-1px);
}
.file-card:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
.file-icon {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  margin-bottom: 24px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.06);
  font-size: 27px;
}
.file-card.folder .file-icon {
  background: var(--blue-soft);
  color: var(--blue);
}
.file-name {
  overflow: hidden;
  margin: 0 0 5px;
  font-weight: 650;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.file-meta {
  color: var(--muted);
  font-size: 12px;
}
.favorite-button {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.favorite-button:hover {
  background: var(--hover);
}
.favorite-button.on {
  color: #eac26b;
}
.file-grid.list .file-card {
  display: grid;
  grid-template-columns: 44px minmax(200px, 1fr) 120px 120px 40px;
  align-items: center;
  min-height: 62px;
  padding: 8px 10px;
  border-width: 0 0 1px;
  border-radius: 0;
  background: transparent;
}
.file-grid.list .file-icon {
  width: 38px;
  height: 38px;
  margin: 0;
  font-size: 20px;
}
.file-grid.list .file-name {
  margin: 0;
}
.file-grid.list .file-meta {
  display: contents;
}
.file-grid.list .favorite-button {
  position: static;
}
.upload-panel {
  position: fixed;
  z-index: 20;
  right: 20px;
  bottom: 20px;
  display: flex;
  flex-direction: column;
  width: 390px;
  max-height: 68vh;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #242423;
  box-shadow: var(--shadow);
  transform: translateY(calc(100% + 40px));
  transition: transform 0.22s ease;
}
.upload-panel.open {
  transform: translateY(0);
}
.panel-header,
.panel-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
}
.panel-header {
  border-bottom: 1px solid var(--border);
}
.panel-header h2 {
  margin: 0;
  font-size: 16px;
}
.panel-header span,
.panel-footer {
  color: var(--muted);
  font-size: 12px;
}
.panel-footer {
  border-top: 1px solid var(--border);
}
.upload-list {
  overflow: auto;
  padding: 6px;
}
.upload-item {
  padding: 12px;
  border-radius: 8px;
}
.upload-item:hover {
  background: rgba(255, 255, 255, 0.03);
}
.upload-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.upload-row strong {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
}
.upload-row span {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 11px;
}
.progress-track {
  height: 4px;
  margin-top: 9px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.09);
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  width: 0;
  background: var(--blue);
  transition: width 0.2s;
}
.upload-item.done .progress-bar {
  background: var(--green);
}
.upload-item.failed .progress-bar {
  background: var(--red);
}
.text-button {
  padding: 5px;
  background: transparent;
  color: var(--blue);
}
dialog {
  color: var(--text);
}
.modal,
.preview-modal {
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #242423;
  box-shadow: var(--shadow);
}
dialog::backdrop {
  background: rgba(0, 0, 0, 0.62);
  backdrop-filter: blur(4px);
}
.settings-modal {
  width: min(520px, calc(100vw - 32px));
  max-height: calc(100vh - 32px);
  overflow: auto;
}
.small-modal {
  width: 420px;
}
.modal form {
  padding: 24px;
}
.modal-header,
.preview-toolbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
.modal-header h2 {
  margin: 2px 0 0;
  font-size: 22px;
}
.eyebrow {
  margin: 0;
  color: var(--blue);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.modal-description {
  margin: 10px 0 22px;
  color: var(--muted);
  line-height: 1.5;
}
.modal label {
  display: grid;
  gap: 8px;
  margin: 16px 0;
  color: var(--muted);
  font-size: 13px;
}
.modal input[type="text"],
.modal input[type="password"] {
  width: 100%;
  height: 44px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  outline: 0;
  background: #191919;
  color: var(--text);
}
.modal input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--blue-soft);
}
.checkbox-row {
  display: flex !important;
  grid-template-columns: auto 1fr !important;
  align-items: center;
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 24px;
}
.settings-status {
  min-height: 18px;
  color: var(--muted);
  font-size: 13px;
}
.settings-status.success {
  color: var(--green);
}
.settings-status.error {
  color: var(--red);
}

.settings-status:empty {
  display: none;
}
.settings-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 8px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  white-space: nowrap;
}
.settings-footer .settings-danger-actions,
.settings-footer .modal-actions {
  margin-top: 0;
  padding-top: 0;
  border-top: 0;
}
.settings-footer .settings-danger-actions {
  display: flex;
  justify-content: flex-start;
  flex: 0 0 auto;
}
.settings-footer .settings-footer-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  flex: 0 0 auto;
}
.settings-danger-actions .danger-button {
  min-height: 34px;
  width: auto;
  padding: 6px 10px;
  border: 1px solid var(--red);
  border-radius: 7px;
  background: transparent;
  color: var(--red);
  cursor: pointer;
  font-size: 13px;
  font-weight: 650;
}
.settings-danger-actions .danger-button:hover {
  background: var(--red);
  color: #fff;
  filter: none;
}
.preview-modal {
  width: calc(100vw - 48px);
  height: calc(100vh - 48px);
  max-width: none;
  max-height: none;
}
.preview-toolbar {
  height: 68px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.preview-toolbar > div {
  display: flex;
  align-items: center;
  gap: 12px;
}
.preview-toolbar > div:first-child {
  display: grid;
  gap: 3px;
}
.preview-toolbar span {
  color: var(--muted);
  font-size: 12px;
}
.compact {
  min-height: 40px;
}
.preview-stage {
  display: grid;
  place-items: center;
  height: calc(100% - 68px);
  overflow: auto;
  outline: none;
  background: #111;
}
.preview-stage img,
.preview-stage video {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.preview-stage audio {
  width: min(640px, 80%);
}
.preview-stage iframe {
  width: 100%;
  height: 100%;
  border: 0;
  background: #fff;
}
.unsupported-preview {
  text-align: center;
  color: var(--muted);
}
.unsupported-preview strong {
  display: block;
  margin-bottom: 8px;
  color: var(--text);
  font-size: 20px;
}
.toast-stack {
  position: fixed;
  z-index: 100;
  right: 24px;
  top: 88px;
  display: grid;
  gap: 8px;
}
.toast {
  width: 320px;
  padding: 13px 15px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #2b2b2a;
  box-shadow: var(--shadow);
  animation: toast-in 0.2s ease;
}
.toast.error {
  border-color: rgba(233, 115, 102, 0.4);
}
.toast.success {
  border-color: rgba(114, 188, 143, 0.4);
}
@keyframes toast-in {
  from {
    transform: translateY(-8px);
    opacity: 0;
  }
}
@media (max-width: 980px) {
  html,
  body {
    min-width: 760px;
  }
  .app-shell {
    grid-template-columns: 210px 1fr;
  }
  .sidebar {
    padding-inline: 12px;
  }
  .content-area {
    padding: 24px;
  }
  .topbar {
    padding-inline: 24px;
  }
  .search-box {
    width: 210px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    animation: none !important;
    transition: none !important;
  }
}

.card-actions {
  position: absolute;
  top: 10px;
  right: 10px;
  display: flex;
}
.card-actions .favorite-button {
  position: static;
  display: grid;
  place-items: center;
}
.file-grid.list .card-actions {
  position: static;
  justify-content: flex-end;
}
.fixed-preview {
  overflow: hidden;
}
.fixed-preview .preview-stage {
  position: relative;
  overflow: hidden;
  padding: 20px;
  overscroll-behavior: none;
  touch-action: auto;
}
.fixed-preview video {
  display: block;
  width: min(100%, 1280px);
  height: auto;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  pointer-events: auto;
  touch-action: auto;
  background: #000;
}
.fixed-preview img {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.fixed-preview iframe {
  overflow: hidden;
}
.fixed-preview audio {
  touch-action: auto;
}
.preview-toolbar {
  overflow: hidden;
  align-items: center;
}
.preview-toolbar > div:first-child {
  min-width: 0;
}
.preview-toolbar > div:last-child {
  flex: 0 0 auto;
}
.preview-toolbar strong {
  max-width: 52vw;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.preview-modal {
  width: min(94vw, 1800px);
  height: 92vh;
}
.fixed-preview .preview-stage {
  padding: 12px;
}
.fixed-preview video {
  width: 100%;
  height: auto;
  max-height: 100%;
  object-fit: contain;
  pointer-events: auto;
}
.fixed-preview video::-webkit-media-controls {
  pointer-events: auto;
}

.context-menu {
  position: fixed;
  z-index: 120;
  display: grid;
  min-width: 172px;
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: #2a2a29;
  box-shadow: var(--shadow);
}
.context-menu button {
  min-height: 38px;
  padding: 8px 12px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.context-menu button:hover {
  background: var(--hover);
}
.context-menu button.danger {
  color: #ffaaa1;
}
.context-menu button.danger:hover {
  background: rgba(233, 115, 102, 0.12);
}

.search-box > span {
  display: grid;
  place-items: center;
  min-width: 22px;
  font-size: 22px;
  line-height: 1;
}
.file-grid:not(.list) .file-meta {
  display: block;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.45;
}
.file-grid:not(.list) .file-meta + .file-meta {
  margin-top: 3px;
}

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;

  flex: 0 0 auto;
  margin: 0 !important;
}
.switch-control input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
.switch-track {
  width: 42px;
  height: 24px;
  padding: 2px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: #191919;
  transition: 0.16s ease;
}
.switch-track::after {
  content: "";
  display: block;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--muted);
  transition: 0.16s ease;
}
.switch-control input:checked + .switch-track {
  border-color: var(--blue);
  background: var(--blue-soft);
}
.switch-control input:checked + .switch-track::after {
  transform: translateX(18px);
  background: var(--blue);
}
.switch-control input:focus-visible + .switch-track {
  box-shadow: 0 0 0 3px var(--blue-soft);
}
